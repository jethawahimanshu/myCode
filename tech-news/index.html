<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tech News Feed</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <header>
            <div class="header-content">
                <h1>📰 Tech News Feed</h1>
                <p class="subtitle">Top 3 tech stories, updated every 3 hours</p>
            </div>
            <div class="update-info">
                <span class="last-update">Last updated: <span id="lastUpdate">Loading...</span></span>
                <span class="next-update">Next update: <span id="nextUpdate">-</span></span>
            </div>
        </header>

        <div class="refresh-section">
            <button id="refreshBtn" class="refresh-btn">
                <span class="refresh-icon">🔄</span> Refresh Now
            </button>
        </div>

        <div id="loadingIndicator" class="loading">
            <div class="spinner"></div>
            <p>Loading tech news...</p>
        </div>

        <div id="newsContainer" class="news-container">
            <!-- News items will be inserted here -->
        </div>

        <div id="errorContainer" class="error-container" style="display: none;">
            <p>Failed to load news. Please try again later.</p>
            <button onclick="location.reload()" class="retry-btn">Retry</button>
        </div>

        <footer>
            <p>Powered by Hacker News API</p>
            <a href="../" class="back-link">← Back to Apps</a>
        </footer>
    </div>

    <script src="app.js"></script>
</body>
</html>
